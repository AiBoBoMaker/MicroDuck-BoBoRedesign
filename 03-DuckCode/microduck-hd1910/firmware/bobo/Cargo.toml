[package]
name = "bobo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bobo voice session"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "io-util", "net"] }
tracing.workspace = true
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# Pure Rust Opus, so the robot build does not need libopus installed.
opus-rs = "0.1.40"
