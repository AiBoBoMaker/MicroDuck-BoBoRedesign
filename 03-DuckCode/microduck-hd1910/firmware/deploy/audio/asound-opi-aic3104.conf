# Orange Pi Zero 2W + HAT TLV320AIC3104
# Bytes from duckmix-capture.service → FIFO /run/duckmix/cap.raw
# (MIC2R, sox speed 0.5, S16/16k/mono raw).
#
# arecord -D duckmix_cap -f S16_LE -r 16000 -c 1 -d 3 /tmp/t.wav
# ALSA "file" plugin requires both file= and infile=.

pcm.duckmix_cap_file {
	type file
	slave.pcm "null"
	file "/dev/null"
	infile "/run/duckmix/cap.raw"
	format "raw"
}

pcm.duckmix_cap {
	type plug
	slave.pcm "duckmix_cap_file"
}

pcm.duckmix {
	type asym
	playback.pcm "plughw:CARD=aic3104,DEV=0"
	capture.pcm "duckmix_cap"
}
